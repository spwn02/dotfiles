general.import = []

[env]
TERM = "xterm-256color"

[terminal]
shell = { program = "/bin/sh", args = ["-lc", "exec \"$HOME/.local/bin/nyxara-tmux\""] }
osc52 = "CopyPaste"

[font]
normal = { family = "Fira Code" }
bold = { family = "Fira Code" }
italic = { family = "Fira Code" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5c2e7"

[colors.selection]
text = "#cdd6f4"
background = "#5b3d58"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
